name: Evidence V2 regression
on:
  push:
    branches: [feat/evidence-v2-optimized]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: evidence-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ''
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      MATH_AGENT_BROWSER_TEST: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: python -m pip install -c constraints.txt -e '.[test]'
      - name: Install browser and isolated Redis executable
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Run offline regression (never uses paid model credentials)
        run: python -m pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-results
          path: test-results.xml
          if-no-files-found: ignore
          retention-days: 7
  development-wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download public dependencies for disconnected development
        run: >-
          python -m pip download --only-binary=:all: -c constraints.txt -d wheels
          langgraph langsmith Flask waitress redis
      - uses: actions/upload-artifact@v4
        with:
          name: development-wheels-py313
          path: wheels/
          retention-days: 3
